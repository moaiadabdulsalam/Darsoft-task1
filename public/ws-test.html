<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darsoft News — Real-Time WebSocket Live Feed</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .status-badge.connected {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border-color: rgba(34, 197, 94, 0.3);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      background-color: var(--card-bg);
      border-radius: 0.75rem;
      border: 1px dashed var(--border);
    }
    .event-card {
      background-color: var(--card-bg);
      border-radius: 0.75rem;
      padding: 1.25rem;
      border-left: 4px solid var(--primary);
      border: 1px solid var(--border);
      border-left-width: 4px;
      animation: fadeIn 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .event-card.created { border-left-color: var(--success); }
    .event-card.updated { border-left-color: var(--warning); }
    .event-card.deleted { border-left-color: var(--danger); }
    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .event-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
    }
    .created .event-tag { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .updated .event-tag { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .deleted .event-tag { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .event-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .event-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .event-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Darsoft Real-Time News Stream</h1>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">
          Listening to WebSocket events (<code>newsCreated</code>, <code>newsUpdated</code>, <code>newsDeleted</code>)
        </p>
      </div>
      <div id="status" class="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
    </header>

    <main id="feed" class="feed-container">
      <div id="empty" class="empty-state">
        <p>Waiting for live news events from the server...</p>
        <small style="margin-top: 0.5rem; display: block;">Use Swagger or Postman with Admin token to create, update, or delete news.</small>
      </div>
    </main>
  </div>

  <script>
    const socket = io('http://localhost:3000');
    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('status-text');
    const feedEl = document.getElementById('feed');
    const emptyEl = document.getElementById('empty');

    socket.on('connect', () => {
      statusEl.classList.add('connected');
      statusTextEl.innerText = 'Connected (ws://localhost:3000)';
    });

    socket.on('disconnect', () => {
      statusEl.classList.remove('connected');
      statusTextEl.innerText = 'Disconnected';
    });

    function addEventCard(type, tag, title, description) {
      if (emptyEl) {
        emptyEl.style.display = 'none';
      }
      const time = new Date().toLocaleTimeString();
      const card = document.createElement('div');
      card.className = `event-card ${type}`;
      card.innerHTML = `
        <div class="event-header">
          <span class="event-tag">${tag}</span>
          <span class="event-time">${time}</span>
        </div>
        <div class="event-title">${escapeHtml(title)}</div>
        ${description ? `<div class="event-desc">${escapeHtml(description)}</div>` : ''}
      `;
      feedEl.prepend(card);
    }

    socket.on('newsCreated', (data) => {
      addEventCard('created', 'News Created', data.title || 'Untitled', data.description || '');
    });

    socket.on('newsUpdated', (data) => {
      addEventCard('updated', 'News Updated', data.title || 'Updated News', data.description || '');
    });

    socket.on('newsDeleted', (data) => {
      addEventCard('deleted', 'News Deleted', `News ID: ${data.id}`, 'The article was deleted by an Administrator.');
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
